# devbase-core is a shell-based installer distributed via git
# No build artifacts or containers - using 'meta' type for changelog-only releases
artifacts:
  - name: devbase-core
    project-type: meta
    working-directory: .
containers: []

# The release files (checksums) and the release commit and tag are signed
# with the organisation's GPG key in RELEASE_GPG_PRIVATE_KEY, as before.
sign:
  method: gpg
git-signing:
  method: gpg
